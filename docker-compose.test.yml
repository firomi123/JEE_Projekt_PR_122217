# Throwaway PostgreSQL and MinIO for the functional API tests (Stage 3+).
# Data lives in tmpfs (RAM), so every `up` starts from an empty state.
#   npm run test:infra:up     # start, wait until healthy, create the bucket
#   npm run test:infra:down   # stop and remove
# Credentials here are test-only and never used outside these containers.

name: driver-docs-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: driver_docs_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - '127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d driver_docs_test']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-test:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: testminio
      MINIO_ROOT_PASSWORD: testminio-secret
    tmpfs:
      - /data
    ports:
      - '127.0.0.1:${TEST_MINIO_PORT:-9100}:9000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-test-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio-test:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >-
        mc alias set local http://minio-test:9000 testminio testminio-secret &&
        mc mb --ignore-existing local/documents-test
