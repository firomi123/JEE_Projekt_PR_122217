# Continuous integration: lint, type checks, build, tests (unit, functional API,
# end-to-end UI) and coverage reports on every push and pull request.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Monitoring configuration (promtool, amtool)
        run: bash monitoring/chaos-test.sh config

  tests:
    name: Unit and functional tests (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the test PostgreSQL and MinIO
        run: npm run test:infra:up
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-unit
          path: |
            backend/coverage
            frontend/coverage
            shared/coverage

  e2e:
    name: End-to-end tests (Playwright, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Start the test PostgreSQL and MinIO
        run: npm run test:infra:up
      - run: npm run test:e2e:coverage
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/coverage-e2e

  docker:
    name: Docker images and stack health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate .env with random secrets
        run: node scripts/init-env.mjs
      - name: Build and start the whole stack (waits until every service is healthy)
        run: docker compose up -d --build --wait
      - name: Smoke test through nginx
        run: curl -fsS http://localhost:8090/api/health/ready
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
