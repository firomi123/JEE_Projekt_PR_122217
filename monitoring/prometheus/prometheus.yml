# Prometheus: what to scrape, alert rules and where to send alerts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Application metrics (prom-client): HTTP, uploads, failed logins, DB, Node.js.
  - job_name: backend
    static_configs:
      - targets: ['backend:3000']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  # CPU, memory and restarts of every container.
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Resources of the Docker host (disk, memory, CPU).
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # Loki and Alloy have no shell for a healthcheck; `up` for these jobs is how
  # their health is watched (alert TargetDown).
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']

  # Black-box probes from the user's point of view, through the frontend nginx.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://frontend:8080/
          - http://frontend:8080/api/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
