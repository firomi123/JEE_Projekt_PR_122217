# Serves the built SPA and proxies /api/* to the backend container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Uploaded document photos/PDFs are limited to 10 MB by the API.
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Docker's embedded DNS; the variable forces re-resolution, so a restarted
    # backend container (new IP) is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Liveness of nginx itself, used by the container healthcheck.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are handled by the React router.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
